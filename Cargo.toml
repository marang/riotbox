[workspace]
members = [
    "crates/riotbox-app",
    "crates/riotbox-audio",
    "crates/riotbox-core",
    "crates/riotbox-sidecar",
]
resolver = "2"

[workspace.package]
edition = "2024"
license-file = "LICENSE"
version = "0.1.0"

[workspace.dependencies]
hex = "0.4.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tempfile = "3"

# Temporary, reviewed upstream dependency correction; see vendor/dawproject/PATCH.md.
[patch.crates-io]
dawproject = { path = "vendor/dawproject" }
